<!DOCTYPE html>
<html lang="es-ES">
<head>
<meta charset="UTF-8">
<!-- Plantilla base para HyperFrames: lienzo vertical 1080×1920, un solo timeline GSAP.
     Cambia DURACION (aquí y en data-duration), la paleta y las escenas. -->
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=block" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  :root {
    --fondo: #F4F1EA;   /* dominante */
    --texto: #111111;   /* lectura */
    --acento: #FF2E88;  /* solo lo importante */
    --titular: "Instrument Serif", Georgia, serif;
    --lectura: "Inter", Arial, sans-serif;
    /* Zona segura (guía de anuncios de Reels de Meta: 14 % arriba, 35 % abajo, 6 % a los lados) */
    --seg-arriba: 269px; --seg-abajo: 672px; --seg-lado: 65px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--fondo); }
  #main { position: relative; width: 1080px; height: 1920px; overflow: hidden;
          color: var(--texto); font-family: var(--lectura); }
  .escena { position: absolute; inset: 0; visibility: hidden; }
  /* Guías: añade class="con-guias" a <body> para revisar; quítala para entregar */
  .guias { display: none; position: absolute; inset: 0; pointer-events: none; z-index: 99; }
  .con-guias .guias { display: block; }
  .guias .segura { position: absolute; top: var(--seg-arriba); bottom: var(--seg-abajo);
                   left: var(--seg-lado); right: var(--seg-lado); outline: 3px dashed #00A3FF; }
  .guias .tercios { position: absolute; inset: 0;
    background:
      linear-gradient(#00A3FF55, #00A3FF55) 360px 0 / 2px 100% no-repeat,
      linear-gradient(#00A3FF55, #00A3FF55) 720px 0 / 2px 100% no-repeat,
      linear-gradient(#00A3FF55, #00A3FF55) 0 640px / 100% 2px no-repeat,
      linear-gradient(#00A3FF55, #00A3FF55) 0 1280px / 100% 2px no-repeat; }

  .centro { position:absolute; left:var(--seg-lado); right:var(--seg-lado); top:620px; text-align:left; padding:0 40px; }
  h1, h2 { font-family: var(--titular); font-weight: 400; font-size: 168px; line-height: .98; letter-spacing:-1px; }
  p.grande { font-family: var(--titular); font-size: 128px; line-height: 1.02; }
  .mascara .linea { display:block; overflow:hidden; padding-bottom:.12em; }
  .mascara .linea > span { display:block; }
  .clave { display:inline-block; transform-origin:0% 80%; }
  #e4 h2 { letter-spacing:0px; text-align:center; font-family:var(--lectura); font-weight:800; font-size:120px; }
  .cambio { display:inline-grid; overflow:hidden; vertical-align:bottom; padding-bottom:.12em; }
  .cambio > span { grid-area:1/1; }
  #e6 p { font-family:"JetBrains Mono", monospace; font-size:62px; }
  .cursor { display:inline-block; width:.55em; height:1em; background:var(--acento); vertical-align:-0.12em; margin-left:6px; }
  .etq { position:absolute; left:105px; top:430px; font: 600 34px var(--lectura); letter-spacing:4px; text-transform:uppercase; color:#8a857c; }
</style>
</head>
<body>
<div id="main" data-composition-id="main" data-start="0" data-duration="18" data-width="1080" data-height="1920">

  <section class="escena" id="e1"><div class="etq">1 · Máscara</div><div class="centro"><h1 class="mascara"><span class="linea"><span>Lento entra,</span></span><span class="linea"><span>rápido sale.</span></span></h1></div></section>
  <section class="escena" id="e2"><div class="etq">2 · Escalonado</div><div class="centro"><p class="grande">Cada palabra llega cuando la dirías.</p></div></section>
  <section class="escena" id="e3"><div class="etq">3 · Énfasis</div><div class="centro"><p class="grande">Una sola palabra <span class="clave">manda.</span></p></div></section>
  <section class="escena" id="e4"><div class="etq">4 · Tracking</div><div class="centro"><h2>RESPIRA</h2></div></section>
  <section class="escena" id="e5"><div class="etq">5 · Sustitución</div><div class="centro"><p class="grande">Se mueve como un <span class="cambio"><span class="a">robot.</span><span class="b">humano.</span></span></p></div></section>
  <section class="escena" id="e6"><div class="etq">6 · Máquina</div><div class="centro"><p><span class="txt">escribiendo en directo</span><span class="cursor"></span></p></div></section>

  <div class="guias" aria-hidden="true"><div class="segura"></div><div class="tercios"></div></div>
</div>
<script>
  // HyperFrames pausa este timeline y lo busca fotograma a fotograma: nada de Date.now(),
  // setTimeout, requestAnimationFrame ni Math.random() sin semilla.
  window.__timelines = window.__timelines || {};
  const DURACION = 18;
  document.fonts.ready.then(function () {
    const tl = gsap.timeline({ paused: true });

// Devuelve los <span> creados. El texto completo queda en aria-label para lectores de pantalla.
function partir(el, modo, mascara) {           // modo: "palabras" | "letras"; mascara: true/false
  const texto = el.textContent;
  el.setAttribute("aria-label", texto);
  el.textContent = "";
  const hechos = [];
  texto.split(/(\s+)/).forEach(function (pal) {
    if (pal === "") return;
    if (/^\s+$/.test(pal)) { el.append(pal); return; }
    const caja = document.createElement("span");    // una caja por palabra: nunca se parte entre dos líneas
    caja.setAttribute("aria-hidden", "true");
    caja.style.cssText = "display:inline-block;white-space:nowrap" +
      (mascara ? ";overflow:hidden;vertical-align:bottom;padding-bottom:.12em" : "");
    (modo === "letras" ? Array.from(pal) : [pal]).forEach(function (t) {
      const s = document.createElement("span");
      s.textContent = t;
      s.style.display = "inline-block";
      caja.append(s);
      hechos.push(s);
    });
    el.append(caja);
  });
  return hechos;
}
const ACENTO = getComputedStyle(document.documentElement).getPropertyValue("--acento").trim();

    const D = 3; // cada escena dura 3 s
    function escena(id, n) { tl.set(id, {visibility:"visible"}, n*D); tl.set(id, {visibility:"hidden"}, (n+1)*D); }
    ["#e1","#e2","#e3","#e4","#e5","#e6"].forEach(escena);
    tl.from("#e1 .linea > span", { yPercent: 120, duration: 0.8, ease: "power4.out", stagger: 0.12 }, 0.2);
    tl.to("#e1 .linea > span", { yPercent: -120, duration: 0.4, ease: "power2.in", stagger: 0.06 }, 2.5);
    const pal = partir(document.querySelector("#e2 p"), "palabras");
    tl.from(pal, { y: 40, opacity: 0, duration: 0.5, ease: "power3.out", stagger: 0.09 }, 3.2);
    tl.from("#e3 p", { opacity: 0, y: 30, duration: 0.5, ease: "power3.out" }, 6.1);
    tl.to("#e3 .clave", { scale: 1.18, color: ACENTO, duration: 0.45, ease: "back.out(2)" }, 7.0);
    const letras4 = partir(document.querySelector("#e4 h2"), "letras");
    const centro = (letras4.length - 1) / 2;
    tl.from(letras4, { x: function (i) { return (i - centro) * 40; }, opacity: 0, duration: 1.4, ease: "power3.out" }, 9.1);
    tl.from("#e5 p", { opacity: 0, y: 30, duration: 0.5, ease: "power3.out" }, 12.1);
    tl.set("#e5 .b", { yPercent: 130 }, 0);
    tl.to("#e5 .a", { yPercent: -130, duration: 0.5, ease: "power3.in" }, 13.3);
    tl.to("#e5 .b", { yPercent: 0, color: ACENTO, duration: 0.6, ease: "power3.out" }, 13.45);
    const caja6 = document.querySelector("#e6 .txt");
const texto6 = caja6.textContent;
caja6.setAttribute("aria-label", texto6);
caja6.textContent = "";
caja6.style.whiteSpace = "pre";   // una sola línea: la máquina de escribir pide frases cortas
const letras = Array.from(texto6).map(function (c) {
  const s = document.createElement("span"); s.textContent = c; caja6.append(s); return s;
});
gsap.set(letras, { display: "none" });   // ocultas y sin ocupar sitio: el cursor va detrás de la última letra
letras.forEach(function (l, i) { tl.set(l, { display: "inline" }, 15.2 + i * 0.06); });
    tl.to("#e6 .cursor", { opacity: 0, duration: 0.01, repeat: 7, yoyo: true, repeatDelay: 0.35 }, 15.1);
    tl.set({}, {}, DURACION); // el timeline dura exactamente lo mismo que la composición
    window.__timelines["main"] = tl; // la clave coincide con data-composition-id
  });
</script>
</body>
</html>
